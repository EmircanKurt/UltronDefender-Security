name: Ultron Defender CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and selected benign regression tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK (8.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore tests/AegisPC.Review.Tests/AegisPC.Review.Tests.csproj

    - name: Build Review dependencies (Release)
      run: dotnet build tests/AegisPC.Review.Tests/AegisPC.Review.Tests.csproj -c Release --no-restore --warnaserror

    - name: Run selected benign tests
      run: |
        ./scripts/Test-BenignPreview.ps1 -NoBuild -ResultsDirectory ./coverage

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: coverage/*.trx
